name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter '!apps-docs' typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter '!apps-docs' build

      - run: pnpm --filter '!apps-docs' test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter '!apps-docs' build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t maetrik:ci .

      - name: Test Docker image
        run: |
          docker run -d -p 3000:3000 --name maetrik-test maetrik:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then
              echo ""
              echo "Server is healthy"
              docker stop maetrik-test
              exit 0
            fi
            echo "Waiting for server... ($i/15)"
            sleep 2
          done
          echo "Server failed to start"
          docker logs maetrik-test
          docker stop maetrik-test
          exit 1
