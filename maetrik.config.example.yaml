# maetrik configuration file
# Copy this to maetrik.config.yaml and customize

server:
  port: 3000
  host: localhost

# Data sources (database connections defined in config file)
# These are read-only and cannot be modified via the API
# Use the API to create additional connections stored in the state database
dataSources:
  - id: main
    type: postgres
    credentials:
      host: localhost
      port: 5432
      database: myapp
      user: ${DB_USER}
      password: ${DB_PASSWORD}

# LLM provider
llm:
  driver: ollama
  model: llama3
  baseUrl: http://localhost:11434
  # Or for OpenAI:
  # driver: openai
  # model: gpt-4o
  # apiKey: ${OPENAI_API_KEY}

# Encryption for database-stored credentials
# Plaintext mode stores credentials as-is (suitable for local development)
encryption:
  default: local
  profiles:
    local:
      mode: plaintext

# State storage for internal server data
# Supported: pglite (embedded) and postgres (external)
stateStorage:
  type: pglite
  path: ./data/state.db
  # type: postgres
  # connectionString: ${STATE_DATABASE_URL}
